<label>Криптокошелёк <em>USDT · TRC-20</em></label><input id="ad" placeholder="T..." maxlength="34" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="hint">Адрес из 34 символов, начинается с «T».</div>

document.addEventListener('input',e=>{if(e.target.id=='sq'){q=e.target.value;$('#dl').innerHTML=dealList()}if(e.target.id=='cin')calcUp(e.target.value)});
